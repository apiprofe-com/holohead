<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HoloHead Screensaver</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
</style>
</head>
<body>
  <!-- A muted fullscreen video. ?v=<YouTube id or link>; defaults to the Coral City Camera.
       YouTube needs to know the embedding site (error 153 otherwise), hence this wrapper page. -->
  <iframe id="v" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script src="js/common.js?v=10"></script>
  <script>
    const v = HH.params.get('v') || '7i8ARjIeM2k';
    HH.playVideo(document.getElementById('v'), HH.toEmbedUrl(/^[\w-]{11}$/.test(v) ? `https://youtu.be/${v}` : v));
  </script>
</body>
</html>
